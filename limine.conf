# ============================================================================
# AzamiOS — Limine Bootloader Configuration
# File: limine.conf
#
# Limine v8+ configuration file.
# Reference: https://github.com/limine-bootloader/limine/wiki/Configuration
# ============================================================================

# Global timeout before automatically booting the first entry (in seconds).
timeout: 0
serial: yes

# Default terminal background colour (RRGGBB, no '#').
terminal_background: 0x000000

# ── Boot entry ───────────────────────────────────────────────────────────────
/:AzamiOS Kernel (x86_64)
    protocol: limine
    # Path to the kernel ELF relative to the partition root.
    kernel_path: boot():/boot/kernel.elf

    # Initrd / ramfs image packed as a ext2 filesystem.
    module_path: boot():/boot/initrd.ext2
    module_cmdline: initrd

    # Kernel command line passed in the Limine info structure.
    kernel_cmdline: azami_root=/dev/ram0 debug

    # Request Limine to set up a 32 MB higher-half direct map (HHDM) starting
    # at 0xFFFF800000000000. The kernel reads the exact base from the Limine
    # HHDM response structure at boot time.
    #
    # Framebuffer: ask Limine for the highest-resolution mode the firmware offers.
    framebuffer_width:  0
    framebuffer_height: 0
    framebuffer_bpp:    32

# ── Recovery / debug entry ───────────────────────────────────────────────────
/:AzamiOS (serial debug, single-core)
    protocol: limine
    kernel_path: boot():/boot/kernel.elf
    module_path:  boot():/boot/initrd.ext2
    module_string: initrd
    kernel_cmdline: azami_root=/dev/ram0 debug nosmp nographic
    framebuffer_width:  1280
    framebuffer_height: 720
    framebuffer_bpp:    32
